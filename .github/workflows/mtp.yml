name: Copy prayer times
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scrape_mtp.py
      - name: Save changes
        run: |
          git config user.name "namaz-bot"
          git config user.email "namaz-bot@users.noreply.github.com"
          git add mtp.json
          git diff --cached --quiet || git commit -m "Update prayer times" && git push
